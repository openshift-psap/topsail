apiVersion: v1
kind: Pod
metadata:
  labels:
    app: gpu-burn
  name: gpu-burn-{{ gpu_node_name }}
  namespace: {{ gpu_operator_run_gpu_burn_namespace }}
spec:
  restartPolicy: Never
  # force the name of the node in which this pod should run
  nodeName: "{{ gpu_node_name }}"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1001
  containers:
  - image: nvcr.io/nvidia/cuda:12.3.1-devel-ubi8
    imagePullPolicy: Always
    name: gpu-burn-ctr
    command:
    - bash
    - -xe
    - /mnt/gpu-burn-entrypoint/entrypoint.sh
    volumeMounts:
    - name: entrypoint
      mountPath: /mnt/gpu-burn-entrypoint/entrypoint.sh
      readOnly: true
      subPath: entrypoint.sh
    - name: src
      mountPath: /mnt/gpu-burn-src
      readOnly: true
    env:
    - name: GPU_BURN_TIME
      value: "{{ gpu_operator_run_gpu_burn_runtime }}"
    resources:
      limits:
        # Request all GPUs available on this node
        nvidia.com/gpu: {{ gpu_count }}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    runAsNonRoot: true
  volumes:
  - name: entrypoint
    configMap:
      name: gpu-burn-entrypoint
  - name: src
    configMap:
      name: gpu-burn-src
